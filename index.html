<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f9fd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121419" media="(prefers-color-scheme: dark)">
<title>Browser App</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f8f9fd;--tb:#f8f9fd;--card:#eceff6;--pill:#e1e6f0;--pill2:#dbe3f5;--omni:#e6eaf3;--tx:#1b1b1f;--tx2:#5a5d66;--ic:#44474f;--line:#cfd2dc;--menu:#eef1f9;--circ:#d9e0ee;--circd:#e4e7ee;--blue:#0b57d0;--cont:#d3e3fd;--oncont:#041e49;--danger:#b3261e;--ripple:rgba(0,0,0,.08);--opill:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121419;--tb:#1b1d23;--card:#1d2027;--pill:#33363e;--pill2:#232c45;--omni:#2c2f37;--tx:#e3e2e6;--tx2:#a9acb6;--ic:#c4c6d0;--line:#3a3d46;--menu:#2d3038;--circ:#16181d;--circd:#4a4d55;--blue:#a8c7fa;--cont:#b9ccf9;--oncont:#0b2a5c;--danger:#f2b8b5;--ripple:rgba(255,255,255,.1);--opill:#0e1014}}
:root[data-theme=dark]{--bg:#121419;--tb:#1b1d23;--card:#1d2027;--pill:#33363e;--pill2:#232c45;--omni:#2c2f37;--tx:#e3e2e6;--tx2:#a9acb6;--ic:#c4c6d0;--line:#3a3d46;--menu:#2d3038;--circ:#16181d;--circd:#4a4d55;--blue:#a8c7fa;--cont:#b9ccf9;--oncont:#0b2a5c;--danger:#f2b8b5;--ripple:rgba(255,255,255,.1);--opill:#0e1014}
:root.incog{--bg:#1f2023;--tb:#2a2b2f;--card:#2b2c30;--pill:#3c3d42;--pill2:#34353a;--omni:#3a3b40;--tx:#e8eaed;--tx2:#a0a3a9;--ic:#c4c7cc;--line:#45464b;--menu:#34353a;--circ:#222326;--circd:#4a4b50;--blue:#c7b7ff;--cont:#d5c9ff;--oncont:#241a52;--danger:#f2b8b5;--ripple:rgba(255,255,255,.1);--opill:#17181a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:"Google Sans",Roboto,"Segoe UI",system-ui,-apple-system,Arial,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
svg.i{width:24px;height:24px;fill:currentColor;display:block;pointer-events:none}
#app{position:fixed;left:0;right:0;top:0;height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);background:var(--bg)}
/* ===== toolbar ===== */
#top{height:56px;flex:none;display:flex;align-items:center;padding:0 2px 0 2px;background:var(--tb);position:relative;z-index:30}
#top.ntp{background:var(--bg)}
.ib{width:46px;height:48px;display:grid;place-items:center;color:var(--ic);border-radius:50%;flex:none}
.ib:active,.mrow:active,.srow:active,.orow:active,.opt:active{background:var(--ripple)}
.ib[disabled]{opacity:.38;pointer-events:none}
#omni{flex:1;min-width:0;height:44px;border-radius:22px;background:var(--omni);display:flex;align-items:center;padding:0 2px 0 6px;margin:0 4px}
#top.ntp #omni{visibility:hidden}
#secIc{width:34px;height:34px;display:grid;place-items:center;color:var(--ic);flex:none}
#secIc svg{width:18px;height:18px}
#secIc.warn{color:var(--danger)}
#urlText{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px;padding:0 4px}
#urlText span{color:var(--tx2)}
#omni .ib{width:40px;height:40px}
#avatar{display:none;width:32px;height:32px;margin:0 8px 0 0;border-radius:50%;background:#0b5345;color:#fff;font-size:16px;place-items:center;flex:none}
#top.ntp #avatar{display:grid}
#tabBtn span{width:28px;height:28px;border:2.5px solid var(--ic);border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--ic)}
#progress{height:3px;flex:none;position:relative;z-index:31;margin-top:-3px;pointer-events:none}
#bar{height:100%;width:0;background:var(--blue);opacity:0}
/* ===== page area ===== */
#view{flex:1;position:relative;overflow:hidden;background:var(--bg)}
.frame{position:absolute;left:0;top:0;width:100%;height:100%;border:0;background:#fff;display:none}
.frame.on{display:block}
#ntp{position:absolute;inset:0;display:none;overflow:auto;background:var(--bg)}
#ntp.on{display:block}
.ntpbody{padding:0 18px 28px;display:flex;flex-direction:column;align-items:center;min-height:100%;background:var(--bg);color:var(--tx)}
.word{font-size:62px;font-weight:400;letter-spacing:-2px;margin:46px 0 30px;line-height:1}
.spill{width:100%;height:68px;border-radius:34px;background:var(--pill);display:flex;align-items:center;gap:14px;padding:0 14px 0 22px;color:var(--tx2);font-size:18px;cursor:text}
.spill span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spill b{display:grid;place-items:center;width:38px;height:38px;color:var(--tx)}
.spill>b:first-child{color:var(--tx);margin-left:-6px}
.pills{display:flex;gap:12px;width:100%;margin-top:14px}
.pills button{flex:1;height:50px;border-radius:25px;background:var(--pill2);display:flex;align-items:center;justify-content:center;gap:12px;font-size:17px;font-weight:500}
.ncard{width:100%;background:var(--card);border-radius:28px;margin-top:22px;overflow:hidden}
.tilesrow{display:flex;gap:2px;overflow-x:auto;padding:18px 12px 16px;scrollbar-width:none}
.tilesrow::-webkit-scrollbar{display:none}
.tile{flex:none;width:80px;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:13px}
.tile i{width:54px;height:54px;border-radius:50%;background:var(--pill);display:grid;place-items:center;font-style:normal;font-size:22px;font-weight:500;color:#fff}
.tile span{max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tips{padding:20px}
.tips h4{margin:0 0 14px;font-size:19px;font-weight:400}
.tips .row2{display:flex;gap:18px;align-items:center}
.blob{width:84px;height:84px;flex:none;background:var(--pill2);border-radius:38% 62% 55% 45%/48% 40% 60% 52%;display:grid;place-items:center;color:var(--blue)}
.blob svg{width:40px;height:40px}
.tips h5{margin:0;font-size:21px;font-weight:400;line-height:1.2}
.tips p{margin:6px 0 0;color:var(--tx2);font-size:14px;line-height:1.35}
.tips .go{display:block;margin:10px 0 0 auto;background:var(--cont);color:var(--oncont);border-radius:22px;padding:12px 24px;font-weight:500;font-size:16px}
.incogbox{margin-top:70px;text-align:left;width:100%}
.incogbox svg{width:64px;height:64px;color:var(--tx)}
.incogbox h2{font-size:30px;font-weight:400;margin:18px 0 12px}
.incogbox p{color:var(--tx2);line-height:1.5;font-size:15px;margin:0 0 10px}
/* ===== omnibox layer ===== */
#omniLayer{position:absolute;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}
#omniLayer.on{display:flex}
.opill{margin:8px 8px 6px;height:58px;flex:none;border-radius:29px;background:var(--opill);display:flex;align-items:center;padding:0 8px 0 6px;border:1px solid var(--line)}
.opill input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--tx);font:inherit;font-size:18px;padding:0 8px;height:100%}
.opill input::placeholder{color:var(--tx2)}
.opill .ib{width:44px;height:44px}
#olist{margin:4px 8px 0;border-radius:24px;background:var(--card);overflow:auto;flex:none;max-height:calc(100% - 90px)}
.orow{display:flex;align-items:center;min-height:62px;width:100%;border-bottom:1px solid var(--bg)}
.orow:last-child{border-bottom:0}
.orow .main{flex:1;min-width:0;display:flex;align-items:center;gap:20px;padding:0 4px 0 18px;height:62px}
.orow .main svg{width:24px;height:24px;color:var(--ic);flex:none}
.orow .t{flex:1;min-width:0}.orow .t b{display:block;font-weight:400;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orow .t small{display:block;color:var(--tx2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orow .fill{width:52px;height:62px;display:grid;place-items:center;color:var(--ic);flex:none}
#oempty{flex:1}
/* ===== menu ===== */
#scrim{position:absolute;inset:0;z-index:79;display:none}
#scrim.on{display:block}
#menu{position:absolute;right:8px;top:calc(env(safe-area-inset-top) + 6px);width:min(310px,calc(100% - 16px));max-height:calc(100dvh - 16px);overflow:auto;background:var(--menu);color:var(--tx);border-radius:28px;box-shadow:0 6px 24px rgba(0,0,0,.35);z-index:80;padding:14px 12px 10px;display:none;transform-origin:top right}
#menu.on{display:block;animation:pop .14s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.mcircles{display:flex;justify-content:space-between;padding:0 4px 10px}
.mc{width:46px;height:46px;border-radius:50%;background:var(--circ);display:grid;place-items:center;color:var(--tx)}
.mc[disabled]{background:var(--circd);opacity:.5;pointer-events:none}
.mrow{display:flex;align-items:center;gap:22px;height:50px;padding:0 14px;width:100%;font-size:17px;border-radius:14px}
.mrow svg{color:var(--ic)}
.msep{height:1px;background:var(--line);margin:6px 14px}
.chk{width:20px;height:20px;border:2px solid var(--ic);border-radius:4px;margin-left:auto;flex:none;display:grid;place-items:center}
.chk.on{background:var(--blue);border-color:var(--blue)}
.chk.on::after{content:"";width:5px;height:10px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
/* ===== full screens ===== */
.full{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.full.on{display:flex}
#switcher{z-index:50}#panel{z-index:55}#settings{z-index:70}
.fh{height:60px;flex:none;display:flex;align-items:center;padding:0 6px;gap:6px}
.fh h1{flex:1;margin:0;font-size:24px;font-weight:400;padding-left:10px}
/* switcher */
#swTop{height:72px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 10px}
#swPlus{width:56px;height:56px;border-radius:18px;background:var(--cont);color:var(--oncont);display:grid;place-items:center}
#swPlus svg{width:30px;height:30px}
#swSeg{display:flex;background:var(--card);border-radius:22px;padding:4px;gap:2px}
#swSeg button{width:56px;height:52px;border-radius:18px;display:grid;place-items:center;color:var(--ic)}
#swSeg button.on{background:var(--pill)}
#swSeg .cnt{width:28px;height:28px;border:2.5px solid var(--ic);border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:700}
#swSearch{margin:6px 10px 10px;height:56px;flex:none;border-radius:28px;background:var(--card);display:flex;align-items:center;padding:0 22px;border-bottom:0}
#swSearch input{flex:1;border:0;outline:0;background:transparent;color:var(--tx);font:inherit;font-size:20px;min-width:0}
#swSearch input::placeholder{color:var(--tx2)}
#grid{flex:1;overflow:auto;padding:12px 10px 16px;display:grid;grid-template-columns:repeat(2,1fr);gap:14px;align-content:start;border-top:1px solid var(--line)}
@media(min-width:700px){#grid{grid-template-columns:repeat(4,1fr)}}
.tcard{background:var(--card);border-radius:28px;overflow:hidden;height:260px;display:flex;flex-direction:column;cursor:pointer}
.tcard.act{background:var(--cont);color:var(--oncont)}
.tcard .ch{display:flex;align-items:center;gap:10px;padding:0 6px 0 14px;height:54px;flex:none}
.tcard .ch i{width:26px;height:26px;border-radius:50%;background:var(--blue);color:var(--bg);font-style:normal;font-size:13px;font-weight:600;display:grid;place-items:center;flex:none}
.tcard .ch b{flex:1;min-width:0;font-weight:400;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcard .ch .x{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;flex:none}
.tcard .ch .x svg{width:22px;height:22px}
.tcard .cb{flex:1;margin:0 9px 9px;border-radius:20px;background:var(--bg);color:var(--tx);overflow:hidden;position:relative;display:grid;place-items:center}
.tcard .cb .thumb{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
.tcard .cb .hostbig{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:14px;color:var(--tx2);padding:8px;text-align:center;word-break:break-all}
.tcard .cb .hostbig i{width:48px;height:48px;border-radius:50%;font-style:normal;font-size:20px;color:#fff;display:grid;place-items:center}
.empty{padding:56px 24px;text-align:center;color:var(--tx2)}
/* history / bookmarks list */
#plist{flex:1;overflow:auto;margin:0 10px;border-radius:24px 24px 0 0;background:var(--card)}
/* settings */
#sSearch{margin:4px 14px 12px;height:56px;flex:none;border-radius:28px;background:var(--card);display:flex;align-items:center;gap:16px;padding:0 20px;color:var(--tx2)}
#sSearch input{flex:1;border:0;outline:0;background:transparent;color:var(--tx);font:inherit;font-size:18px;min-width:0}
#sBody{flex:1;overflow:auto;padding:0 14px 24px}
.slabel{font-size:15px;font-weight:600;padding:22px 16px 12px;color:var(--tx)}
.srow{display:block;width:100%;background:var(--card);padding:20px 20px;margin-bottom:3px;border-radius:6px}
.srow.f{border-radius:24px 24px 6px 6px}.srow.l{border-radius:6px 6px 24px 24px}.srow.f.l{border-radius:24px}
.srow b{display:block;font-weight:400;font-size:19px}.srow small{display:block;margin-top:6px;color:var(--tx2);font-size:15px}
/* dialog */
#dlg{position:absolute;inset:0;z-index:100;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:20px}
#dlg.on{display:flex}
.dbox{background:var(--menu);color:var(--tx);border-radius:28px;padding:24px 24px 14px;width:100%;max-width:380px;max-height:90%;overflow:auto}
.dbox h3{margin:0 0 12px;font-weight:400;font-size:24px}
.dbox p{margin:0 0 8px;color:var(--tx2);font-size:15px;line-height:1.5}
.opt{display:flex;align-items:center;gap:16px;padding:13px 0;font-size:17px;width:100%}
.rad{width:22px;height:22px;border:2px solid var(--ic);border-radius:50%;flex:none}
.rad.on{border-color:var(--blue);background:radial-gradient(var(--blue) 0 45%,transparent 50%)}
.dbox input[type=text]{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit;padding:0 14px;margin-top:8px}
.dbtns{display:flex;justify-content:flex-end;gap:6px;margin-top:14px}
.dbtns button{padding:12px 16px;border-radius:20px;color:var(--blue);font-weight:500;font-size:16px}
#toast{position:absolute;left:50%;bottom:48px;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:120;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
#toast.on{opacity:1}
</style>
</head>

const ENGINES = {

  ddg:{name:'DuckDuckGo', url:'https://duckduckgo.com/?q='},

};
const DEFAULT_TILES = [['Wikipedia','https://en.m.wikipedia.org'],['Archive','https://archive.org'],['Maps','https://www.openstreetmap.org'],['MDN','https://developer.mozilla.org'],['W3Schools','https://www.w3schools.com']];

const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let settings = Object.assign({ engine:'google', homeOn:true, homeUrl:'', theme:'system' }, store.get('settings', {}));
let tabs = [], activeId = null, uid = 0, fbTile = null, deferredInstall = null, swMode = 'n';

/* ---------- helpers ---------- */
const icon = n => '<svg class="i"><use href="#i-' + n + '"/></svg>';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cur = () => tabs.find(t => t.id === activeId);
const engine = () => ENGINES[settings.engine] || ENGINES.google;
function safeUrl(u){ try{ const x = new URL(String(u).trim(), location.href); return /^https?:$/.test(x.protocol) ? x.href : null; }catch(e){ return null; } }
function hostOf(u){ try{ return new URL(u).host.replace(/^www\./,''); }catch(e){ return u || ''; } }
function isUrlLike(raw){
  raw = raw.trim();
  return /^https?:\/\//i.test(raw) || raw === 'privacy-policy.html' || (!/\s/.test(raw) && (/^[^\s]+\.[a-z]{2,}([\/?#:].*)?$/i.test(raw) || /^localhost(:\d+)?([\/?#].*)?$/i.test(raw)));
}
function normalize(raw){
  raw = (raw || '').trim(); if(!raw) return null;
  if(/^https?:\/\//i.test(raw) || raw === 'privacy-policy.html') return safeUrl(raw);
  if(isUrlLike(raw)) return safeUrl('https://' + raw);
  return engine().url + encodeURIComponent(raw);
}
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 1900); }
function colorFor(s){ let h = 0; for(const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return 'hsl(' + h + ',45%,42%)'; }
function applyTheme(){
  const r = document.documentElement;
  if(settings.theme === 'system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', settings.theme);
}
function saveSettings(){ store.set('settings', settings); }
applyTheme();

/* ---------- tabs ---------- */
function newTab(url, incog){
  const t = { id: ++uid, url:'', title:'New tab', hist:[], idx:-1, loading:false, desktop:false, frame:null, incog: !!incog };
  tabs.push(t); activeId = t.id;
  if(url) go(t, url); else render();
  return t;
}
function ensureFrame(t){
  if(t.frame) return t.frame;
  const f = document.createElement('iframe');
  f.className = 'frame';
  f.setAttribute('allow', 'camera *; microphone *; geolocation *; fullscreen *; clipboard-write *; clipboard-read *; autoplay *; web-share *; downloads *');
  f.setAttribute('allowfullscreen', '');
  f.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
  f.onload = () => onFrameLoad(t, f);
  $('#frames').appendChild(f); t.frame = f; return f;
}
function onFrameLoad(t, f){
  if(!t.url) return;
  t.loading = false;
  try{
    const d = f.contentDocument, h = f.contentWindow.location.href;
    if(d && h && h !== 'about:blank'){ t.title = d.title || hostOf(h); if(h !== t.url){ t.url = h; t.hist[t.idx] = h; } }
  }catch(e){}
  addHistory(t); finishProgress(t); render();
}
function go(t, url, push = true){
  const u = safeUrl(url); if(!u) return;
  if(push){ t.hist = t.hist.slice(0, t.idx + 1); t.hist.push(u); t.idx = t.hist.length - 1; }
  t.url = u; t.title = hostOf(u); t.loading = true;
  ensureFrame(t).src = u;
  startProgress(t); render();
}
function goStart(t){ t.url = ''; t.title = 'New tab'; t.loading = false; t.hist = []; t.idx = -1; if(t.frame) t.frame.src = 'about:blank'; render(); }
function tabsOfMode(inc){ return tabs.filter(t => !!t.incog === !!inc); }
function closeTab(id){
  const i = tabs.findIndex(t => t.id === id); if(i < 0) return;
  const t = tabs[i], inc = t.incog; if(t.frame) t.frame.remove();
  tabs.splice(i, 1);
  if(!tabsOfMode(inc).length){
    if(inc){ const n = tabsOfMode(false); if(n.length) activeId = n[0].id; else newTab(); }
    else if(!tabs.length) newTab(); else if(activeId === id) activeId = tabs[0].id;
  }else if(activeId === id){ activeId = tabsOfMode(inc)[Math.min(tabsOfMode(inc).length - 1, 0)].id; }
  render(); if($('#switcher').classList.contains('on')) renderSwitcher();
}
function closeAllTabs(){
  tabsOfMode(swMode === 'i').forEach(t => { if(t.frame) t.frame.remove(); tabs = tabs.filter(x => x !== t); });
  if(swMode === 'i'){ const n = tabsOfMode(false); if(n.length) activeId = n[0].id; else newTab(); }
  else if(!tabs.length) newTab(); else activeId = tabs[0].id;
  if(!tabsOfMode(swMode === 'i').length){ swMode = 'n'; }
  render(); renderSwitcher();
}

/* ---------- navigation ---------- */
const canBack = () => { const t = cur(); return !!t && t.idx > 0; };
const canFwd = () => { const t = cur(); return !!t && t.idx < t.hist.length - 1; };
function back(){ const t = cur(); if(canBack()){ t.idx--; go(t, t.hist[t.idx], false); } }
function fwd(){ const t = cur(); if(canFwd()){ t.idx++; go(t, t.hist[t.idx], false); } }
function reload(){
  const t = cur(); if(!t || !t.url) return;
  if(t.loading){ try{ t.frame.contentWindow.stop(); }catch(e){} t.loading = false; finishProgress(t); render(); return; }
  go(t, t.url, false);
}
function goHome(){
  const t = cur(); const h = settings.homeOn ? safeUrl(settings.homeUrl) : null;
  if(h) go(t, h); else goStart(t);
}

/* ---------- progress ---------- */
function startProgress(t){
  if(t.id !== activeId) return;
  const b = $('#bar'); b.style.transition = 'none'; b.style.opacity = 1; b.style.width = '0';
  void b.offsetWidth; b.style.transition = 'width 6s cubic-bezier(.1,.7,.3,1)'; b.style.width = '85%';
}
function finishProgress(t){
  if(t.id !== activeId) return;
  const b = $('#bar'); b.style.transition = 'width .2s'; b.style.width = '100%';
  setTimeout(() => { const c = cur(); if(!c || !c.loading){ b.style.transition = 'opacity .3s'; b.style.opacity = 0; } }, 250);
}

/* ---------- start page (new tab page) ---------- */
function tilesList(){
  const out = [];
  if(fbTile) out.push([fbTile.title, fbTile.url]);
  const seen = new Set(out.map(o => hostOf(o[1])));
  store.get('history', []).forEach(h => { const k = hostOf(h.url); if(out.length < 8 && !seen.has(k) && !/privacy-policy/.test(h.url) && h.url.indexOf(location.origin) !== 0){ seen.add(k); out.push([h.title && h.title !== k ? h.title : k, h.url]); } });
  DEFAULT_TILES.forEach(d => { const k = hostOf(d[1]); if(out.length < 8 && !seen.has(k)){ seen.add(k); out.push(d); } });
  return out;
}
function ntpHtml(incog){

  const tiles = tilesList().map(t => '<button class="tile" data-u="' + esc(t[1]) + '"><i style="background:' + colorFor(hostOf(t[1])) + '">' + esc((t[0] || '?')[0].toUpperCase()) + '</i><span>' + esc(t[0]) + '</span></button>').join('');
  return '<div class="ntpbody"><div class="word">Browser</div>' +
    '<div class="spill" data-a="omni"><b data-a="newtab">' + icon('add') + '</b><span>Search ' + esc(engine().name) + ' or type…</span><b data-a="mic">' + icon('mic') + '</b><b data-a="lens">' + icon('lens') + '</b></div>' +
    '<div class="pills"><button data-a="ai">' + icon('search') + 'AI Mode</button><button data-a="incog">' + icon('incog') + 'Incognito</button></div>' +
    '<div class="ncard"><div class="tilesrow">' + tiles + '</div></div>' +
    '<div class="ncard tips"><h4>Browser tips</h4><div class="row2"><div class="blob">' + icon('brush') + '</div><div><h5>Customize your homepage</h5><p>Make Browser your own with custom colors and a homepage you choose</p></div></div><button class="go" data-a="theme">Try it now</button></div></div>';
}
$('#ntp').addEventListener('click', e => {
  const u = e.target.closest('[data-u]'); if(u){ go(cur(), u.dataset.u); return; }
  const a = e.target.closest('[data-a]'); if(!a) return;
  ({ omni: () => openOmni(), newtab: () => newTab(null, cur().incog), mic: () => { openOmni(); voice(); }, lens: () => window.open('https://lens.google.com/', '_blank', 'noopener'),
     ai: () => go(cur(), 'https://www.google.com/search?udm=50&igu=1'), incog: () => newTab(null, true), theme: () => themeDialog() })[a.dataset.a]();
});

/* ---------- render ---------- */
function render(){
  const t = cur(); if(!t) return;
  document.documentElement.classList.toggle('incog', t.incog);
  const mine = tabsOfMode(t.incog);
  $('#tabCount').textContent = mine.length > 99 ? ':D' : mine.length;
  tabs.forEach(x => { if(x.frame) x.frame.classList.toggle('on', x.id === t.id && !!x.url); });
  const ntp = $('#ntp'); ntp.classList.toggle('on', !t.url);
  if(!t.url){ ntp.innerHTML = ntpHtml(t.incog); }
  $('#top').classList.toggle('ntp', !t.url);
  $('#reloadBtn').innerHTML = icon(t.loading ? 'close' : 'refresh');
  const https = /^https:/.test(t.url);
  $('#secIc').innerHTML = icon(https ? 'lock' : 'info'); $('#secIc').classList.toggle('warn', !!t.url && !https);
  $('#urlText').innerHTML = urlMarkup(t);
  $('#oInput').placeholder = 'Search ' + engine().name + ' or type URL';
  applyDesktop(t);
}
function urlMarkup(t){
  if(!t.url) return '';
  try{
    const u = new URL(t.url), host = u.host.replace(/^www\./,'');
    if(u.origin === location.origin) return esc(t.title && t.title !== host ? t.title : host);
    const rest = (u.pathname !== '/' ? u.pathname : '') + u.search;
    return esc(host) + (rest ? '<span>' + esc(rest) + '</span>' : '');
  }catch(e){ return esc(t.url); }
}
function applyDesktop(t){
  const f = t.frame; if(!f) return;
  if(t.desktop){
    const w = 1280, s = $('#view').clientWidth / w;
    f.style.width = w + 'px'; f.style.height = ($('#view').clientHeight / s) + 'px'; f.style.transform = 'scale(' + s + ')'; f.style.transformOrigin = '0 0';
  }else{ f.style.width = f.style.height = '100%'; f.style.transform = ''; }
}
addEventListener('resize', () => { const t = cur(); if(t) applyDesktop(t); });

/* ---------- history, searches, bookmarks ---------- */
function addHistory(t){
  if(!t.url || t.incog) return;
  let h = store.get('history', []).filter(x => x.url !== t.url);
  h.unshift({ url: t.url, title: t.title, t: Date.now() }); store.set('history', h.slice(0, 200));
}
function saveSearch(q){
  let s = store.get('searches', []).filter(x => x.toLowerCase() !== q.toLowerCase());
  s.unshift(q); store.set('searches', s.slice(0, 30));
}
function toggleBookmark(){
  const t = cur(); if(!t.url) return;
  let b = store.get('bookmarks', []);
  if(b.some(x => x.url === t.url)){ b = b.filter(x => x.url !== t.url); toast('Bookmark removed'); }
  else{ b.unshift({ url: t.url, title: t.title }); toast('Bookmark added'); }
  store.set('bookmarks', b);
}
function openPanel(kind){
  closeMenu();
  const key = kind === 'history' ? 'history' : 'bookmarks';
  $('#pTitle').textContent = kind === 'history' ? 'History' : 'Bookmarks';
  const list = store.get(key, []);
  $('#plist').innerHTML = list.length ? list.map(h => '<div class="orow"><button class="main" data-u="' + esc(h.url) + '">' + icon(kind === 'history' ? 'history' : 'star') + '<span class="t"><b>' + esc(h.title || hostOf(h.url)) + '</b><small>' + esc(hostOf(h.url)) + '</small></span></button></div>').join('') : '<div class="empty">' + (kind === 'history' ? 'No history here' : 'No bookmarks yet') + '</div>';
  $('#pClear').style.display = list.length ? '' : 'none'; $('#pClear').dataset.k = key;
  $('#panel').classList.add('on');
}
$('#plist').addEventListener('click', e => { const r = e.target.closest('[data-u]'); if(r){ $('#panel').classList.remove('on'); go(cur(), r.dataset.u); } });
$('#pClose').onclick = () => $('#panel').classList.remove('on');
$('#pClear').onclick = () => { store.set($('#pClear').dataset.k, []); openPanel($('#pClear').dataset.k === 'history' ? 'history' : 'bookmarks'); };

/* ---------- omnibox / search screen ---------- */
const oIn = $('#oInput');
function openOmni(){
  const t = cur();
  $('#omniLayer').classList.add('on');
  oIn.value = t.url && !/privacy-policy/.test(t.url) ? t.url : '';
  buildSuggest(oIn.value);
  setTimeout(() => { oIn.focus(); oIn.select(); }, 60);
}
function closeOmni(){ $('#omniLayer').classList.remove('on'); oIn.blur(); }
function buildSuggest(q){
  q = (q || '').trim(); const t = cur(), inc = t.incog; let html = '', n = 0;
  const row = (ic, title, sub, val, fillable) => '<div class="orow"><button class="main" data-q="' + esc(val) + '">' + icon(ic) + '<span class="t"><b>' + esc(title) + '</b>' + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</span></button>' + (fillable ? '<button class="fill" data-f="' + esc(val) + '" aria-label="Use this suggestion">' + icon('nw') + '</button>' : '') + '</div>';
  if(!q){
    if(!inc) store.get('searches', []).slice(0, 8).forEach(s => { html += row('history', s, '', s, true); n++; });
  }else{
    html += row('search', q, isUrlLike(q) ? 'Go to site' : '', q, true); n++;
    const low = q.toLowerCase(), seen = new Set();
    if(!inc) store.get('searches', []).filter(s => s.toLowerCase().includes(low) && s.toLowerCase() !== low).slice(0, 4).forEach(s => { html += row('history', s, '', s, true); n++; });
    const pool = store.get('bookmarks', []).map(b => ({ ...b, bm: 1 })).concat(inc ? [] : store.get('history', []));
    pool.filter(h => (h.url + ' ' + (h.title || '')).toLowerCase().includes(low)).forEach(h => {
      if(seen.has(h.url) || seen.size >= 4) return; seen.add(h.url);
      html += row(h.bm ? 'star' : 'history', h.title || hostOf(h.url), hostOf(h.url), h.url, true); n++;
    });
  }
  const box = $('#olist'); box.innerHTML = html; box.style.display = n ? '' : 'none';
}
oIn.addEventListener('input', () => buildSuggest(oIn.value));
oIn.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); submitOmni(oIn.value); } });
function submitOmni(v){
  v = (v || '').trim(); const u = normalize(v); if(!u) return;
  if(!isUrlLike(v) && !cur().incog) saveSearch(v);
  closeOmni(); go(cur(), u);
}
$('#olist').addEventListener('click', e => {
  const f = e.target.closest('[data-f]'); if(f){ oIn.value = f.dataset.f; buildSuggest(oIn.value); oIn.focus(); return; }
  const r = e.target.closest('[data-q]'); if(r) submitOmni(r.dataset.q);
});
$('#oempty').addEventListener('click', closeOmni);
$('#oPlus').onclick = () => { closeOmni(); newTab(null, cur().incog); };
$('#oLens').onclick = () => window.open('https://lens.google.com/', '_blank', 'noopener');
$('#oMic').onclick = voice;
function voice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast('Voice search isn’t supported here'); return; }
  try{
    const r = new SR(); r.lang = navigator.language || 'en-US'; r.interimResults = false;
    r.onresult = ev => { const q = ev.results[0][0].transcript; oIn.value = q; submitOmni(q); };
    r.onerror = () => toast('Couldn’t hear anything'); r.start(); toast('Listening…');
  }catch(e){ toast('Voice search isn’t available'); }
}
$('#omni').addEventListener('click', e => { if(e.target.closest('#reloadBtn')) return; openOmni(); });
$('#reloadBtn').onclick = e => { e.stopPropagation(); reload(); };

/* ---------- menus ---------- */
function mrow(id, ic, label, extra){ return '<button class="mrow" id="' + id + '">' + icon(ic) + '<span>' + label + '</span>' + (extra || '') + '</button>'; }
function menuMain(){
  const t = cur(), onPage = !!t.url, bm = onPage && store.get('bookmarks', []).some(b => b.url === t.url);
  let h = '<div class="mcircles">' +
    '<button class="mc" id="mBack" ' + (canBack() ? '' : 'disabled') + ' aria-label="Back">' + icon('back') + '</button>' +
    '<button class="mc" id="mFwd" ' + (canFwd() ? '' : 'disabled') + ' aria-label="Forward">' + icon('fwd') + '</button>' +
    '<button class="mc" id="mStar" ' + (onPage ? '' : 'disabled') + ' aria-label="Bookmark" style="' + (bm ? 'color:var(--blue)' : '') + '">' + icon(bm ? 'star' : 'starb') + '</button>' +
    '<button class="mc" id="mShare" ' + (onPage ? '' : 'disabled') + ' aria-label="Share">' + icon('share') + '</button>' +
    '<button class="mc" id="mReload" ' + (onPage ? '' : 'disabled') + ' aria-label="Reload">' + icon(t.loading ? 'close' : 'refresh') + '</button></div>';
  h += mrow('mNew', 'newtab', 'New tab') + mrow('mInc', 'incog', 'New Incognito tab') + '<div class="msep"></div>' +
    mrow('mHist', 'history', 'History') + mrow('mDel', 'delete', 'Delete browsing data') + '<div class="msep"></div>' + mrow('mBook', 'star', 'Bookmarks');
  if(onPage) h += mrow('mDesk', 'desktop', 'Desktop site', '<span class="chk' + (t.desktop ? ' on' : '') + '"></span>') + mrow('mOpen', 'open', 'Open in browser');
  if(deferredInstall) h += mrow('mInstall', 'add', 'Install app');
  h += '<div class="msep"></div>' + mrow('mSet', 'gear', 'Settings') + mrow('mHelp', 'help', 'Help &amp; feedback');
  return h;
}
function menuSwitcher(){
  return mrow('mNew', 'newtab', 'New tab') + mrow('mInc', 'incog', 'New Incognito tab') + mrow('mCloseAll', 'close', 'Close all tabs') + '<div class="msep"></div>' + mrow('mDel', 'delete', 'Delete browsing data') + mrow('mSet', 'gear', 'Settings');
}
function showMenu(html){ $('#menu').innerHTML = html; $('#scrim').classList.add('on'); $('#menu').classList.add('on'); }
function closeMenu(){ $('#scrim').classList.remove('on'); $('#menu').classList.remove('on'); }
$('#menuBtn').onclick = () => showMenu(menuMain());
$('#swMenuBtn').onclick = () => showMenu(menuSwitcher());
$('#scrim').onclick = closeMenu;
$('#menu').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  const act = ({
    mBack: back, mFwd: fwd, mStar: toggleBookmark, mShare: share, mReload: reload,
    mNew: () => { const sw = $('#switcher').classList.contains('on'); const inc = sw ? swMode === 'i' : cur().incog; $('#switcher').classList.remove('on'); newTab(null, inc); },
    mInc: () => { $('#switcher').classList.remove('on'); newTab(null, true); },
    mHist: () => openPanel('history'), mBook: () => openPanel('bookmarks'), mDel: clearDataDialog,
    mDesk: () => { const t = cur(); t.desktop = !t.desktop; if(t.url) go(t, t.url, false); render(); },
    mOpen: () => { const t = cur(); if(t.url) window.open(t.url, '_blank', 'noopener'); },
    mInstall: () => { if(deferredInstall){ deferredInstall.prompt(); deferredInstall = null; } },
    mSet: openSettings, mHelp: aboutDialog, mCloseAll: closeAllTabs
  })[b.id];
  if(!act) return; closeMenu(); act();
});
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; });
function share(){
  const t = cur(); if(!t.url){ toast('Nothing to share'); return; }
  if(navigator.share) navigator.share({ title: t.title, url: t.url }).catch(() => {});
  else if(navigator.clipboard) navigator.clipboard.writeText(t.url).then(() => toast('Link copied')).catch(() => toast(t.url));
  else toast(t.url);
}

/* ---------- tab switcher ---------- */
function renderSwitcher(){
  const nN = tabsOfMode(false).length, nI = tabsOfMode(true).length, inc = swMode === 'i';
  $('#cntN').textContent = nN; $('#segN').classList.toggle('on', !inc); $('#segI').classList.toggle('on', inc);
  const q = $('#swInput').value.trim().toLowerCase();
  const list = tabsOfMode(inc).filter(t => !q || (t.title + ' ' + t.url).toLowerCase().includes(q));
  const W = innerWidth;
  $('#grid').innerHTML = list.length ? list.map(t => {
    const host = t.url ? hostOf(t.url) : '';
    const body = t.url ? '<div class="hostbig"><i style="background:' + colorFor(host) + '">' + esc(host[0].toUpperCase()) + '</i>' + esc(host) + '</div>' : '<div class="thumb" data-thumb="' + t.id + '" style="width:' + W + 'px;height:1000px">' + ntpHtml(t.incog) + '</div>';
    return '<div class="tcard' + (t.id === activeId ? ' act' : '') + '" data-id="' + t.id + '" role="button"><div class="ch"><i>' + esc((t.url ? host : 'N')[0].toUpperCase()) + '</i><b>' + esc(t.url ? t.title : 'New tab') + '</b><button class="x" data-x="' + t.id + '" aria-label="Close tab">' + icon('close') + '</button></div><div class="cb">' + body + '</div></div>';
  }).join('') : '<div class="empty" style="grid-column:1/-1">' + (inc ? 'No Incognito tabs' : 'No tabs') + '</div>';
  document.querySelectorAll('#grid .thumb').forEach(el => { const cb = el.parentElement; const s = cb.clientWidth / W; el.style.transform = 'scale(' + s + ')'; el.style.height = (cb.clientHeight / s) + 'px'; });
}
function openSwitcher(){ swMode = cur().incog ? 'i' : 'n'; $('#swInput').value = ''; $('#switcher').classList.add('on'); renderSwitcher(); }
$('#tabBtn').onclick = openSwitcher;
$('#swPlus').onclick = () => { $('#switcher').classList.remove('on'); newTab(null, swMode === 'i'); };
$('#segN').onclick = () => { swMode = 'n'; renderSwitcher(); };
$('#segI').onclick = () => { swMode = 'i'; renderSwitcher(); };
$('#swInput').addEventListener('input', renderSwitcher);
$('#grid').addEventListener('click', e => {
  const x = e.target.closest('[data-x]'); if(x){ closeTab(+x.dataset.x); return; }
  const c = e.target.closest('.tcard'); if(c){ activeId = +c.dataset.id; $('#switcher').classList.remove('on'); render(); }
});

/* ---------- dialogs ---------- */
function dialog(title, bodyHtml, buttons){
  $('#dbox').innerHTML = '<h3>' + title + '</h3>' + bodyHtml + '<div class="dbtns">' + buttons.map((b, i) => '<button data-b="' + i + '">' + b[0] + '</button>').join('') + '</div>';
  $('#dlg').classList.add('on');
  $('#dbox').onclick = e => { const b = e.target.closest('[data-b]'); if(!b) return; const r = buttons[+b.dataset.b][1] ? buttons[+b.dataset.b][1]() : undefined; if(r !== false) closeDialog(); };
}
function closeDialog(){ $('#dlg').classList.remove('on'); }
$('#dlg').addEventListener('click', e => { if(e.target.id === 'dlg') closeDialog(); });
function radioDialog(title, options, current, onPick){
  dialog(title, options.map(o => '<button class="opt" data-v="' + o[0] + '"><span class="rad' + (o[0] === current ? ' on' : '') + '"></span>' + esc(o[1]) + '</button>').join(''), [['Cancel']]);
  $('#dbox').querySelectorAll('[data-v]').forEach(el => el.addEventListener('click', ev => { ev.stopPropagation(); onPick(el.dataset.v); closeDialog(); }));
}
function themeDialog(){ radioDialog('Theme', [['system','System default'],['light','Light'],['dark','Dark']], settings.theme, v => { settings.theme = v; saveSettings(); applyTheme(); buildSettings(); render(); }); }
function engineDialog(){ radioDialog('Search engine', Object.entries(ENGINES).map(([k, v]) => [k, v.name]), settings.engine, v => { settings.engine = v; saveSettings(); buildSettings(); render(); }); }
function homeDialog(){
  dialog('Homepage',
    '<button class="opt" id="hOn"><span class="chk' + (settings.homeOn ? ' on' : '') + '" style="margin:0"></span>Show home button</button><p style="margin-top:6px">Leave the address empty to open the start page.</p><input type="text" id="hUrl" placeholder="https://example.com" value="' + esc(settings.homeUrl) + '" inputmode="url" autocapitalize="off">',
    [['Cancel'], ['Save', () => { settings.homeOn = $('#hOn .chk').classList.contains('on'); const v = $('#hUrl').value.trim(); if(v && !normalize(v)){ toast('Enter a valid address'); return false; } settings.homeUrl = v ? (isUrlLike(v) ? normalize(v) : ''): ''; saveSettings(); buildSettings(); render(); }]]);
  $('#hOn').onclick = () => $('#hOn .chk').classList.toggle('on');
}
function clearDataDialog(){
  dialog('Delete browsing data',
    ['history|Browsing history','searches|Search history','bookmarks|Bookmarks'].map((s, i) => { const [k, l] = s.split('|'); return '<button class="opt" data-k="' + k + '"><span class="chk' + (i < 2 ? ' on' : '') + '" style="margin:0"></span>' + l + '</button>'; }).join(''),
    [['Cancel'], ['Delete data', () => { document.querySelectorAll('#dbox [data-k]').forEach(o => { if(o.querySelector('.chk').classList.contains('on')) store.set(o.dataset.k, []); }); toast('Data deleted'); render(); }]]);
  $('#dbox').querySelectorAll('[data-k]').forEach(o => o.addEventListener('click', ev => { ev.stopPropagation(); o.querySelector('.chk').classList.toggle('on'); }));
}
function aboutDialog(){
  dialog('About Browser', '<p>Browser App · Version 2.0</p><p>A fast, simple browser. Your history stays on this device.</p>', [['Privacy policy', () => { newTab('privacy-policy.html'); $('#settings').classList.remove('on'); }], ['Close']]);
}

/* ---------- settings ---------- */
const THEME_NAMES = { system:'System default', light:'Light', dark:'Dark' };
function buildSettings(){
  const q = ($('#sInput').value || '').trim().toLowerCase();
  const groups = [
    ['Basics', [['engine','Search engine', engine().name, engineDialog], ['privacy','Privacy and security','Delete browsing data, privacy policy', privacyDialog]]],
    ['Advanced', [['home','Homepage', settings.homeOn ? 'On' : 'Off', homeDialog], ['appearance','Appearance', THEME_NAMES[settings.theme], themeDialog], ['about','About Browser','Version 2.0', aboutDialog]]]
  ];
  let h = ''; const handlers = {};
  groups.forEach(([label, rows]) => {
    rows = rows.filter(r => !q || (r[1] + ' ' + r[2]).toLowerCase().includes(q)); if(!rows.length) return;
    h += '<div class="slabel">' + label + '</div>';
    rows.forEach((r, i) => { handlers[r[0]] = r[3]; h += '<button class="srow' + (i === 0 ? ' f' : '') + (i === rows.length - 1 ? ' l' : '') + '" data-s="' + r[0] + '"><b>' + r[1] + '</b><small>' + esc(r[2]) + '</small></button>'; });
  });
  $('#sBody').innerHTML = h || '<div class="empty">No results</div>'; buildSettings.h = handlers;
}
function privacyDialog(){
  dialog('Privacy and security', '<button class="opt" id="pvDel">Delete browsing data</button><button class="opt" id="pvPol">Privacy policy</button>', [['Close']]);
  $('#pvDel').onclick = () => { closeDialog(); clearDataDialog(); };
  $('#pvPol').onclick = () => { closeDialog(); $('#settings').classList.remove('on'); newTab('privacy-policy.html'); };
}
$('#sBody').addEventListener('click', e => { const r = e.target.closest('[data-s]'); if(r && buildSettings.h[r.dataset.s]) buildSettings.h[r.dataset.s](); });
$('#sInput').addEventListener('input', buildSettings);
function openSettings(){ $('#sInput').value = ''; buildSettings(); $('#settings').classList.add('on'); }
$('#sClose').onclick = () => $('#settings').classList.remove('on');
$('#sHelp').onclick = aboutDialog;

/* ---------- toolbar buttons ---------- */
$('#homeBtn').onclick = goHome;
$('#avatar').onclick = openSettings;

/* ---------- system back gesture ---------- */
history.pushState({ cb: 1 }, '');
addEventListener('popstate', () => {
  let handled = true;
  const on = s => $(s).classList.contains('on');
  if(on('#dlg')) closeDialog();
  else if(on('#menu')) closeMenu();
  else if(on('#omniLayer')) closeOmni();
  else if(on('#settings')) $('#settings').classList.remove('on');
  else if(on('#panel')) $('#panel').classList.remove('on');
  else if(on('#switcher')) $('#switcher').classList.remove('on');
  else if(canBack()) back();
  else if(cur() && cur().url) goStart(cur());
  else handled = false;
  if(handled) history.pushState({ cb: 1 }, '');
});

/* ---------- Firebase: optional shortcut tile ---------- */
function handleValue(val){
  const o = (val && typeof val === 'object') ? val : { url: val };
  const u = o.enabled === false ? null : safeUrl(o.url);
  fbTile = u ? { url: u, title: String(o.title || hostOf(u)) } : null;
  const t = cur(); if(t && !t.url && !$('#switcher').classList.contains('on')) render();
}
newTab();
try{
  if(window.firebase){
    firebase.initializeApp(FB_CONFIG);
    firebase.database().ref(DB_PATH).on('value', s => handleValue(s.val()), () => {});
  }
}catch(e){}
if('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
